<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASVB Bieville-Beuville — Présences</title>
<style>
  :root{
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', 'Courier New', monospace;
    --bg:#0F1720;
    --panel:#16212E;
    --panel-2:#1C2A39;
    --line:#2A3B4E;
    --ink:#EEF1F4;
    --muted:#8CA0B4;
    --gold:#F0B429;
    --blue:#2E7DD1;
    --present:#3FA796;
    --absent:#E2574C;
    --dispo:#F0B429;
    --unset:#3A4A5D;
    --team1:#4C8DFF;
    --team2:#D9739A;
  }
  /* ===== Mode clair (essai) — mêmes variables, palette inversée ===== */
  body.light-theme{
    --bg:#F4F5F8;
    --panel:#FFFFFF;
    --panel-2:#F0F2F6;
    --line:#DCE1E8;
    --ink:#1C2530;
    --muted:#6A7684;
    --gold:#B8790A;
    --blue:#2E7DD1;
    --present:#238370;
    --absent:#C43D31;
    --dispo:#B8790A;
    --unset:#C7CDD6;
    --team1:#2E68C4;
    --team2:#B84C79;
  }
  body.light-theme{ box-shadow:none; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button, .teamtab, .gear-tab, .sess, .icon-btn, .sbtn{-webkit-tap-highlight-color:transparent;outline:none;}
  button:focus, .teamtab:focus, .sess:focus{outline:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s ease, color .2s ease;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}

  /* ===== Header / scoreboard ===== */
  header{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:2px solid var(--gold);
    padding-bottom:8px;margin-bottom:10px;gap:8px;
  }
  .club{
    font-family:var(--font-display);font-weight:800;
    font-size:clamp(15px,4.5vw,22px);
    letter-spacing:0.3px;
    line-height:1;
    text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .club span{color:var(--gold);}
  .header-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .season-tag{
    font-family:var(--font-mono);
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--gold);
    padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;
  }
  .theme-toggle-btn{
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:4px;width:26px;height:26px;font-size:13px;
    cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-toggle-btn:hover{border-color:var(--gold);}

  /* ===== Team tabs ===== */
  .teamtabs{display:flex;gap:8px;margin-bottom:8px;}
  .teamtab{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
    transition:all .15s ease;
    position:relative;
    overflow:hidden;
  }
  .teamtab.active{border-color:var(--gold);background:var(--panel-2);}
  .teamtab[data-team="team1"].active{border-color:var(--team1);}
  .teamtab[data-team="team1"].active .t-name{color:var(--team1);}
  .teamtab[data-team="team2"].active{border-color:var(--team2);}
  .teamtab[data-team="team2"].active .t-name{color:var(--team2);}
  .teamtab .t-name{font-family:var(--font-display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.3px;}
  .teamtab .t-div{color:var(--muted);font-size:10px;font-family:var(--font-mono);margin-top:1px;}
  .teamtab.active .t-name{color:var(--gold);}

  /* ===== Toolbar ===== */
  .toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .toolbar button{
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .toolbar button.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}
  .icon-toggle-btn{
    padding:6px 10px !important;font-size:14px !important;
    width:32px;flex-shrink:0;
  }

  /* ===== Timeline (liste pleine largeur, accordéon) ===== */
  .timeline{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .month-label{
    background:rgba(240,180,41,0.14);
    color:var(--gold);
    font-family:var(--font-mono);
    font-weight:800;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:10px 14px;
    border-top:1px solid rgba(240,180,41,0.35);
    border-bottom:1px solid rgba(240,180,41,0.35);
  }
  .timeline > .month-label:first-child{border-top:none;}
  .sess{
    display:flex;flex-direction:column;gap:4px;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .12s;
  }
  .sess:hover{background:var(--panel-2);}
  .sess.selected{background:var(--panel-2);border-left:3px solid var(--gold);}
  .sess-top{display:flex;align-items:flex-start;gap:10px;}
  .sess-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sess .d{
    font-family:var(--font-mono);font-size:13px;font-weight:600;
    width:28px;color:var(--ink);flex-shrink:0;padding-top:1px;
  }
  .sess .teamcol{
    font-family:var(--font-mono);font-size:10px;font-weight:700;
    border-radius:4px;padding:2px 6px;flex-shrink:0;text-align:center;
  }
  .sess .teamcol.t-team1{color:var(--team1);background:rgba(76,141,255,0.12);border:1px solid rgba(76,141,255,0.35);}
  .sess .teamcol.t-team2{color:var(--team2);background:rgba(217,115,154,0.12);border:1px solid rgba(217,115,154,0.35);}
  .sess .teamcol.t-both{color:var(--gold);background:rgba(240,180,41,0.12);border:1px solid rgba(240,180,41,0.35);}
  .common-tag{font-size:12px;}
  .sess .lbl{font-size:13px;font-weight:600;flex:1;min-width:0;line-height:1.35;}
  .sess .sub{font-size:11px;color:var(--muted);flex:1;min-width:0;}
  .row-time{font-size:13px;font-weight:800;color:var(--gold);font-family:var(--font-mono);}
  .rowcount{
    font-family:var(--font-mono);font-size:15px;font-weight:700;
    display:flex;gap:8px;flex-shrink:0;margin-left:auto;align-items:center;
  }
  .rowcount .rc-m{color:var(--team1);}
  .rowcount .rc-f{color:var(--team2);}
  .rowcount .rc-total{color:var(--gold);}
  .suff-badge{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;
  }
  .suff-badge.ok{background:rgba(63,167,150,0.15);color:var(--present);border:1px solid rgba(63,167,150,0.45);}
  .suff-badge.warn{background:rgba(226,87,76,0.15);color:var(--absent);border:1px solid rgba(226,87,76,0.45);}
  .save-error-msg{
    font-size:12px;font-weight:600;color:var(--absent);
    background:rgba(226,87,76,0.1);border:1px solid rgba(226,87,76,0.35);
    border-radius:6px;padding:5px 10px;margin-top:-2px;
    animation:fadeIn .15s ease;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .save-retry-btn{
    background:var(--absent);color:#fff;border:none;
    padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;
    cursor:pointer;
  }
  .save-retry-btn:disabled{opacity:.6;cursor:default;}
  .save-error-detail{font-size:10px;color:var(--muted);font-weight:400;margin-top:2px;font-family:var(--font-mono);word-break:break-all;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .badge{
    font-size:10px;font-weight:700;letter-spacing:.4px;
    padding:2px 7px;border-radius:20px;text-transform:uppercase;flex-shrink:0;
  }
  .badge.entr{background:#22364a;color:#8fb4d9;}
  .badge.dom{background:#1f4a3d;color:#5fd6ae;}
  .badge.ext{background:#4a2f1f;color:#e8a35f;}
  .badge.coupe{background:#4a3d1f;color:var(--gold);}
  .badge.bye{background:#333;color:#999;}

  /* ===== Main panel (bilan + détail déplié inline) ===== */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px 22px;
    margin-bottom:16px;
  }
  .detail{
    background:var(--panel-2);
    border-top:2px solid var(--gold);
    border-bottom:1px solid var(--line);
    padding:12px 14px 14px;
  }
  .sess-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;}
  .sess-head-compact{padding-bottom:8px;margin-bottom:8px;}
  .sess-head-compact .action-icons{margin-top:4px;}
  .sess-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .action-icons-inline{display:flex;gap:6px;flex-shrink:0;}
  .action-icons-inline .icon-btn{padding:5px 8px;font-size:14px;}
  .sess-head h2{
    font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;
    margin:0 0 4px;letter-spacing:.3px;
  }
  .sess-head-compact h2{font-size:18px;margin-bottom:2px;}
  .sess-meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:14px;}
  .sess-meta b{color:var(--ink);}
  .confirmed{color:var(--present);font-weight:700;}
  .unconfirmed{color:var(--absent);font-weight:700;}
  .match-time{font-size:13px;font-weight:800;color:var(--gold);font-family:var(--font-mono);}
  .opp-contact{
    margin-top:8px;font-size:13px;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--line);
    padding:7px 10px;border-radius:6px;display:inline-block;
  }
  .opp-contact a{color:var(--gold);text-decoration:none;font-weight:700;}
  .opp-contact a:hover{text-decoration:underline;}
  .note{
    margin-top:8px;font-size:12px;color:var(--gold);
    background:rgba(240,180,41,0.08);border:1px solid rgba(240,180,41,0.25);
    padding:6px 10px;border-radius:6px;display:inline-block;
  }

  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .view-toggle{display:flex;gap:6px;}
  .view-toggle button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .view-toggle button.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}

  /* scoreboard tally */
  .tally{
    display:flex;gap:14px;font-family:var(--font-mono);font-size:13px;
  }
  .tally .n{font-size:18px;font-weight:700;}
  .tally .present .n{color:var(--present);}
  .tally .dispo .n{color:var(--dispo);}
  .tally .absent .n{color:var(--absent);}
  .tally .unset .n{color:var(--muted);}

  /* résumé garçons/filles présents ou disponibles */
  .gendertally{
    display:flex;gap:16px;flex-wrap:wrap;
    font-size:12px;font-family:var(--font-mono);
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  }
  .gendertally b{font-size:14px;}
  .gt-m{color:var(--team1);}
  .gt-f{color:var(--team2);}
  .gt-total{color:var(--gold);}
  .gender-tag{font-size:11px;font-weight:700;}
  .gender-tag.gt-tag-m{color:var(--team1);}
  .gender-tag.gt-tag-f{color:var(--team2);}

  /* roster : pastille unique (verte=présent, or=dispo, rouge=absent), noms courts colorés,
     2 colonnes par équipe quand l'effectif est celui d'un entraînement commun */
  .roster{display:flex;flex-direction:column;gap:3px;}
  .roster-columns{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}
  .roster-col{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .roster-col-label{
    font-size:10px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:1px;font-weight:700;
  }
  .roster-col-label.t-team1{color:var(--team1);}
  .roster-col-label.t-team2{color:var(--team2);}
  .prow-compact{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:2px solid var(--line);border-radius:6px;
    padding:6px 8px;min-width:0;cursor:pointer;transition:all .12s;
  }
  .prow-compact:active{transform:scale(0.98);}
  .pname-short{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .pname-short.name-f{color:var(--team2);}
  .pname-short.name-m{color:var(--team1);}
  .prow-compact.status-P{border-color:var(--present);background:rgba(63,167,150,0.12);}
  .prow-compact.status-D{border-color:var(--dispo);background:rgba(240,180,41,0.12);}
  .prow-compact.status-A{border-color:var(--absent);background:rgba(226,87,76,0.12);}

  .bilan-link{
    background:transparent;border:1px solid var(--line);color:var(--gold);
    padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:60px 20px;}

  /* bilan */
  table.bilan{width:100%;border-collapse:collapse;font-size:13px;}
  table.bilan th{
    text-align:left;font-family:var(--font-mono);font-size:11px;
    color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    padding:8px 10px;border-bottom:1px solid var(--line);
  }
  table.bilan td{padding:9px 10px;border-bottom:1px solid var(--line);}
  table.bilan tr:hover td{background:var(--panel-2);}
  .bar-wrap{background:#26374a;border-radius:4px;height:8px;width:100%;overflow:hidden;}
  .bar-fill{height:100%;background:var(--present);}
  .bilan-note{color:var(--muted);font-size:12px;margin-bottom:12px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .footer-note{color:var(--muted);font-size:11px;text-align:center;margin-top:22px;}

  /* ===== Bouton Paramètres compact (icône seule) ===== */
  .gear-tab{
    flex:0 0 40px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .gear-tab:hover{background:var(--panel-2);}
  .gear-tab.active{border-color:var(--gold);background:var(--panel-2);}
  .toggle-hint{color:var(--muted);font-size:10px;margin:0 0 8px 2px;}

  /* ===== Formulaires (ajout/édition de match, ajout de joueur) ===== */
  .form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .form-row label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);}
  .form-row input, .form-row select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:9px 10px;border-radius:6px;font-size:14px;font-family:var(--font-body);
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
  .form-check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .btn-primary{
    background:var(--gold);color:#1a1305;border:none;padding:10px 16px;
    border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .btn-secondary{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn-danger{
    background:transparent;border:1px solid rgba(226,87,76,0.5);color:var(--absent);
    padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .action-icons{display:flex;gap:6px;margin-left:auto;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:5px 9px;border-radius:6px;font-size:13px;cursor:pointer;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--gold);}

  /* ===== Page Paramètres : effectifs ===== */
  .params-team{margin-bottom:22px;}
  .params-team h3{
    font-family:var(--font-display);font-weight:800;text-transform:uppercase;
    font-size:16px;margin:0 0 10px;letter-spacing:.3px;
  }
  .params-team.p-team1 h3{color:var(--team1);}
  .params-team.p-team2 h3{color:var(--team2);}
  .manager-box{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:14px;
  }
  .manager-info{display:flex;flex-direction:column;gap:2px;flex:1;}
  .manager-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);}
  .manager-name{font-size:14px;font-weight:600;}
  .manager-email{font-size:12px;color:var(--gold);text-decoration:none;}
  .manager-email:hover{text-decoration:underline;}
  .manager-info input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;font-size:13px;}
  .plist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .prow-param{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;
  }
  .prow-param .pname{flex:1;font-size:14px;}
  .add-player-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .add-player-row input{flex:1;min-width:140px;}

  /* ===== Vue "présences par joueur" ===== */
  .player-select-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .player-select-row select{flex:1;min-width:180px;}
  .player-sess-list{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow-y:auto;}
  .player-sess-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;
  }
  .player-sess-row .psr-date{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:70px;flex-shrink:0;}
  .player-sess-row .psr-info{flex:1;min-width:0;}
  .player-sess-row .psr-lbl{font-size:13px;font-weight:600;}
  .player-sess-row .psr-sub{font-size:11px;color:var(--muted);}
  .player-month-label{
    font-family:var(--font-mono);font-size:12px;font-weight:800;color:var(--gold);
    text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px;
  }
</style>
</head>
<body class="light-theme">
<div class="wrap">

  <header>
    <div class="club">ASVB <span>Bieville</span>-Beuville</div>
    <div class="header-right">
      <div class="season-tag">26/27</div>
      <button id="theme-toggle" class="theme-toggle-btn" title="Essayer le mode clair">🌙</button>
    </div>
  </header>

  <div class="teamtabs">
    <div class="teamtab active" data-team="team1" id="tab-team1">
      <div class="t-name">Équipe 1</div>
      <div class="t-div">DSUP · lundi 20h30</div>
    </div>
    <div class="teamtab active" data-team="team2" id="tab-team2">
      <div class="t-name">Équipe 2</div>
      <div class="t-div">D3A · lundi 20h30</div>
    </div>
    <div class="gear-tab" data-team="params" id="tab-params" title="Paramètres">⚙️</div>
  </div>

  <div class="toolbar" id="toolbar"></div>
  <div class="panel" id="formPanel" style="display:none;"></div>
  <div class="panel" id="bilanPanel" style="display:none;"></div>
  <div class="panel" id="playerPanel" style="display:none;"></div>
  <div class="timeline" id="timeline"></div>

  <div class="footer-note">Les données de présence sont partagées entre tous les utilisateurs de cet outil (staff du club). Domicile = Gymnase Bieville-Beuville.</div>
</div>

<script>
/* ===== Couche de stockage universelle =====
   Sur Claude.ai, window.storage existe nativement (stockage des artefacts).
   Sur un hébergement statique (Netlify, etc.), window.storage n'existe pas : on bascule
   alors automatiquement sur une fonction serverless Netlify qui utilise Netlify Blobs
   comme base de données. Le reste du code applicatif appelle toujours backendGet/
   backendSet/backendList et n'a pas besoin de savoir où il tourne. */
const IS_NATIVE_STORAGE = !!(window.storage && typeof window.storage.get === "function");
const NETLIFY_FN_URL = "/.netlify/functions/storage";

/* Lit le corps JSON d'une réponse d'erreur pour en extraire le message précis renvoyé
   par la fonction serverless (ex. "MissingBlobsEnvironmentError: ..."), plutôt que de
   se contenter d'un vague "HTTP 500" qui ne dit rien sur la cause réelle. */
async function readFnError(res){
  try{
    const body = await res.json();
    if(body && body.error) return body.error;
  }catch(e){ /* corps non-JSON, on garde juste le code HTTP */ }
  return `HTTP ${res.status}`;
}

async function backendGet(key, shared){
  if(IS_NATIVE_STORAGE) return window.storage.get(key, shared);
  const res = await fetch(`${NETLIFY_FN_URL}?action=get&key=${encodeURIComponent(key)}`);
  if(!res.ok) throw new Error("Storage get failed: "+(await readFnError(res)));
  const data = await res.json();
  if(data.value===null || data.value===undefined) return null;
  return {key, value: data.value, shared};
}
async function backendSet(key, value, shared){
  if(IS_NATIVE_STORAGE) return window.storage.set(key, value, shared);
  const res = await fetch(NETLIFY_FN_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({key, value})
  });
  if(!res.ok) throw new Error("Storage set failed: "+(await readFnError(res)));
  return {key, value, shared};
}
async function backendList(prefix, shared){
  if(IS_NATIVE_STORAGE) return window.storage.list(prefix, shared);
  const res = await fetch(`${NETLIFY_FN_URL}?action=list&prefix=${encodeURIComponent(prefix||"")}`);
  if(!res.ok) throw new Error("Storage list failed: "+(await readFnError(res)));
  const data = await res.json();
  return {keys: data.keys||[], prefix, shared};
}

/* Empêche un appel de stockage lent/bloqué de geler indéfiniment le démarrage de l'appli :
   au-delà du délai, on abandonne cet appel précis et on garde la valeur par défaut. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve=> setTimeout(()=> resolve(undefined), ms))
  ]);
}

/* ===== Surcharges persistantes : matchs ajoutés / modifiés / supprimés par le staff =====
   sessionOverrides[team][date] = objet séance (ajout/modif) OU "__DELETED__" (suppression
   d'une séance du calendrier de base). Fusionné avec BASE_SESSIONS à l'affichage via
   effectiveSessions(). Persisté dans le stockage partagé sous "sessions_override:<team>". */
let sessionOverrides = {team1:{}, team2:{}};

async function loadSessionOverrides(){
  for(const team of ["team1","team2"]){
    try{
      const res = await withTimeout(backendGet("sessions_override:"+team, true), 4000);
      if(res) sessionOverrides[team] = JSON.parse(res.value);
    }catch(e){ /* on garde {} déjà en mémoire (aucune personnalisation) */ }
  }
}
function persistSessionOverrides(team){
  backendSet("sessions_override:"+team, JSON.stringify(sessionOverrides[team]), true).catch(e=>logSilently("sessions_override", e));
}

function effectiveSessions(team){
  const map = {};
  BASE_SESSIONS[team].forEach(s=> map[s.date] = s);
  const ov = sessionOverrides[team] || {};
  Object.keys(ov).forEach(date=>{
    if(ov[date]==="__DELETED__") delete map[date];
    else map[date] = ov[date];
  });
  return Object.values(map).sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0));
}

/* Enregistre un ajout/modif de séance. oldDate est fourni lors d'une édition qui déplace
   la date : on masque/efface l'ancienne entrée avant d'écrire la nouvelle. */
function saveSessionOverride(team, newSession, oldDate){
  const ov = sessionOverrides[team];
  if(oldDate && oldDate !== newSession.date){
    const wasBase = BASE_SESSIONS[team].some(s=>s.date===oldDate);
    if(wasBase) ov[oldDate] = "__DELETED__";
    else delete ov[oldDate];
  }
  ov[newSession.date] = newSession;
  persistSessionOverrides(team);
}

function deleteSessionEntry(team, date){
  const ov = sessionOverrides[team];
  const wasBase = BASE_SESSIONS[team].some(s=>s.date===date);
  if(wasBase) ov[date] = "__DELETED__"; else delete ov[date];
  persistSessionOverrides(team);
}

function sessionLabel(s){
  if(s.type==="match"){
    const conf = s.confirmed===true ? "" : " ⚠";
    if(s.home===true) return {lbl:"Match — "+s.opponent+conf, badge:"DOM", badgeClass:"dom"};
    if(s.home===false) return {lbl:"Match — "+s.opponent+conf, badge: s.replaces?"EXT (lun.)":"EXT", badgeClass:"ext"};
    return {lbl:"Match — "+s.opponent+conf, badge:"?", badgeClass:"ext"};
  }
  if(s.type==="coupe") return {lbl:s.label, badge:"COUPE", badgeClass:"coupe"};
  if(s.type==="bye") return {lbl:"Exempt (pas de match)", badge:"REPOS", badgeClass:"bye"};
  return {lbl:"Entraînement", badge:"ENTR.", badgeClass:"entr"};
}

/* Heure à afficher à côté du jour dans la liste (vide si inconnue, ex. Coupe avant tirage) */
function timeForSession(s){
  if(s.type==="match") return s.time || "";
  if(s.type==="entrainement" || s.type==="bye") return "20h30";
  return "";
}

}

async function toggleRow(rowEl, team, iso){
  const key = team+":"+iso;
  const existingDetail = rowEl.nextElementSibling && rowEl.nextElementSibling.classList.contains("detail") ? rowEl.nextElementSibling : null;

  // Ferme toute autre ligne ouverte (accordéon : une seule à la fois)
  document.querySelectorAll(".detail").forEach(d=>d.remove());
  document.querySelectorAll(".sess.selected").forEach(r=>r.classList.remove("selected"));

  if(existingDetail && expandedKey===key){
    expandedKey = null; // on vient de la fermer
    return;
  }

  expandedKey = key;
  rowEl.classList.add("selected");
  const detail = document.createElement("div");
  detail.className = "detail";
  rowEl.insertAdjacentElement("afterend", detail);
  await renderSessionDetail(detail, team, iso);
}

function renderTimeline(){
  renderGeneration++;
  const myGen = renderGeneration;
  const el = document.getElementById("timeline");
  el.innerHTML = "";
  let lastMonth = null;
  const sessions = effectiveSessions(currentTeam).filter(s=> showPastSessions || !isPastDate(s.date));
  const countTargets = [];
  sessions.forEach(s=>{
    const iso = s.date;
    const f = fmtDate(iso);
    const key = f.year+"-"+f.month;
    if(key!==lastMonth){
      lastMonth = key;
      const ml = document.createElement("div");
      ml.className="month-label";
      ml.textContent = f.monthLabel+" "+f.year;
      el.appendChild(ml);
    }
    const {lbl, badge, badgeClass} = sessionLabel(s);
    const isCommon = isTrainingType(s.type) && isCommonTrainingDate(iso);
    const rowKey = currentTeam+":"+iso;
    const row = document.createElement("div");
    row.className = "sess"+(expandedKey===rowKey?" selected":"");
    row.dataset.date = iso;
    row.innerHTML = `
      <div class="sess-top">
        <div class="d">${String(f.day).padStart(2,"0")}</div>
        <div class="lbl">${lbl}${isCommon ? ' <span class="common-tag" title="Entraînement commun aux 2 équipes">👥</span>' : ""}</div>
        <div class="badge ${badgeClass}">${badge}</div>
      </div>
      <div class="sess-bottom">
        <div class="sub">${DAYNAME[f.weekday]}${timeForSession(s) ? " · <span class=\"row-time\">"+timeForSession(s)+"</span>" : ""}${isCommon ? " · Commun aux 2 équipes" : ""}${s.note && badgeClass==="entr" ? " · "+s.note : ""}</div>
        <div class="rowcount" id="rc-${currentTeam}-${iso}"></div>
      </div>
    `;
    row.addEventListener("click", ()=> toggleRow(row, currentTeam, iso));
    el.appendChild(row);
    countTargets.push({team:currentTeam, iso});
    if(expandedKey===rowKey){
      const detail = document.createElement("div");
      detail.className = "detail";
      el.appendChild(detail);
      renderSessionDetail(detail, currentTeam, iso);
    }
  });
  populateCachedRowCounts(countTargets);
}

/* Charge les présences d'une séance et affiche un compteur compact P/D/A dans la ligne de la liste, sans déplier */
/* Remplit les compteurs de la liste UNIQUEMENT à partir des données déjà en cache
   (aucun nouvel appel réseau). Avant, la liste entière était préchargée en arrière-plan
   à chaque affichage : c'était la principale source de trafic superflu vers le stockage
   partagé et la cause probable des erreurs "rate limit" ressenties par les utilisateurs.
   Désormais, un compteur n'apparaît qu'une fois la séance déjà consultée (déplié une
   fois, ou vue depuis "Par joueur"/bilan) — aucune charge ajoutée en arrière-plan. */
function populateCachedRowCounts(countTargets){
  countTargets.forEach(({team, iso})=>{
    if(attendanceCache[storageKey(team, iso)]) updateRowCount(team, iso);
  });
}

async function updateRowCount(team, iso){
  const el = document.getElementById(`rc-${team}-${iso}`);
  if(!el) return;
  const data = await loadAttendance(team, iso);
  const el2 = document.getElementById(`rc-${team}-${iso}`); // re-vérifie que la ligne existe toujours après l'attente
  if(!el2) return;
  if(Object.keys(data).length===0){ el2.innerHTML = ""; return; }
  const s = findSession(team, iso);
  const sessionType = s ? s.type : "match";
  const {mAvail,mTotal,fAvail,fTotal} = genderAvailability(data, effectiveRoster(team, iso));
  const ok = isSquadSufficient(mAvail, fAvail, sessionType);
  if(sessionType==="entrainement" || sessionType==="bye"){
    const avail = mAvail+fAvail, total = mTotal+fTotal;
    el2.innerHTML = `<span class="rc-total">${avail}/${total}</span><span class="suff-badge ${ok?'ok':'warn'}">${ok?'✓':'!'}</span>`;
  } else {
    el2.innerHTML = `<span class="rc-f">${fAvail}/${fTotal}</span><span class="rc-m">${mAvail}/${mTotal}</span><span class="suff-badge ${ok?'ok':'warn'}">${ok?'✓':'!'}</span>`;
  }
}

function findSession(team, iso){
  if(team==="both") return effectiveSessions("team1").find(s=>s.date===iso) || effectiveSessions("team2").find(s=>s.date===iso) || null;
  return effectiveSessions(team).find(s=>s.date===iso) || null;
}

/* ===== Entraînements communs aux 2 équipes =====
   Règle : quand aucune des 2 équipes n'a de match (ou coupe) ce jour-là — donc que
   les deux ont simplement "Entraînement" ou une semaine "exempte" — c'est en réalité
   la même séance physique (même créneau, même salle). On la traite alors comme UNE
   seule séance partagée : effectif combiné des 2 équipes, feuille de présence commune. */
function isTrainingType(type){ return type==="entrainement" || type==="bye"; }

function isCommonTrainingDate(iso){
  const s1 = findSession("team1", iso);
  const s2 = findSession("team2", iso);
  return !!(s1 && s2 && isTrainingType(s1.type) && isTrainingType(s2.type));
}

function commonRoster(){
  return [
    ...ROSTERS.team1.map(p=>({...p, srcTeam:"team1"})),
    ...ROSTERS.team2.map(p=>({...p, srcTeam:"team2"}))
  ];
}

/* Effectif à utiliser pour une séance donnée : combiné si entraînement commun, sinon celui de l'équipe */
function effectiveRoster(team, iso){
  if(team==="both") return commonRoster();
  if(isCommonTrainingDate(iso)) return commonRoster();
  return ROSTERS[team];
}

function storageKey(team, iso){
  if(team==="both" || isCommonTrainingDate(iso)) return "attendance:commun:"+iso;
  return "attendance:"+team+":"+iso;
}

/* Cache mémoire pour éviter de refaire les mêmes lectures de stockage à chaque
   changement d'onglet (source principale du "rate limit" atteint auparavant). */
const attendanceCache = {};

/* Réessaie un appel de stockage plusieurs fois avec un délai croissant, pour absorber
   les erreurs passagères de type "rate limit exceeded" sans que l'utilisateur les voie. */
/* Journal d'erreurs silencieux : certains environnements (navigateur intégré à
   certaines apps mobiles) affichent automatiquement à l'écran tout ce qui passe par
   console.error, ce qui montrait des messages techniques inutiles à l'utilisateur
   pour des erreurs déjà gérées normalement (retry, repli, message discret dans
   l'interface). On garde une trace consultable (window.__presenceErrorLog) sans
   jamais appeler console.error. */
window.__presenceErrorLog = [];
function logSilently(context, err){
  window.__presenceErrorLog.push({context, message: err && err.message ? err.message : String(err), at: new Date().toISOString()});
  if(window.__presenceErrorLog.length > 50) window.__presenceErrorLog.shift();
}

async function withRetry(fn, retries, baseDelay){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      if(i<retries){
        // un peu de dispersion aléatoire : évite que plusieurs appareils qui échouent
        // au même moment ne retentent tous exactement en même temps (effet de cohue)
        const jitter = 0.7 + Math.random()*0.6;
        await new Promise(r=>setTimeout(r, baseDelay*Math.pow(1.8,i)*jitter));
      }
    }
  }
  throw lastErr;
}

/* Affiche un petit message d'erreur discret juste sous la ligne concernée, avec un
   bouton "Réessayer" qui relance exactement la même action — sans bloquer l'interface
   (contrairement à alert(), qui interrompait l'utilisateur de façon déroutante). */
let lastSaveErrorDetail = "";

function showSaveError(rowEl, retryFn){
  let msg = rowEl.nextElementSibling;
  if(!msg || !msg.classList.contains("save-error-msg")){
    msg = document.createElement("div");
    msg.className = "save-error-msg";
    rowEl.insertAdjacentElement("afterend", msg);
  }
  const detail = lastSaveErrorDetail ? `<div class="save-error-detail">${lastSaveErrorDetail}</div>` : "";
  msg.innerHTML = `
    <div>❌ Non enregistré ${retryFn ? `— <button type="button" class="save-retry-btn">🔄 Réessayer</button>` : "— réessayez"}</div>
    ${detail}
  `;
  // Ce message reste affiché tant que ce n'est pas réellement enregistré : le faire
  // disparaître tout seul après quelques secondes donnait l'impression, à tort, que
  // le clic sur "Réessayer" n'avait aucun effet quand l'utilisateur revenait trop tard.
  if(retryFn){
    msg.querySelector(".save-retry-btn").addEventListener("click", async (e)=>{
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = "⏳ …";
      await retryFn();
    });
  }
}

async function loadAttendance(team, iso){
  const key = storageKey(team, iso);
  if(attendanceCache[key]) return attendanceCache[key];
  try{
    const res = await withRetry(()=>backendGet(key, true), 2, 250);
    const data = res ? JSON.parse(res.value) : {};
    attendanceCache[key] = data;
    return data;
  }catch(e){ logSilently("loadAttendance", e); return {}; }
}
/* Retourne true si la sauvegarde a bien abouti, false sinon (permet à l'appelant
   d'annuler visuellement le changement plutôt que d'afficher un état non sauvegardé). */
async function saveAttendance(team, iso, data){
  const key = storageKey(team, iso);
  attendanceCache[key] = data;
  try{
    await withRetry(()=>backendSet(key, JSON.stringify(data), true), 4, 350);
    lastSaveErrorDetail = "";
    return true;
  }catch(e){
    logSilently("saveAttendance", e);
    lastSaveErrorDetail = "Détail technique : " + (e && e.message ? e.message : String(e));
    return false;
  }
}

/* File d'attente à concurrence limitée : évite d'envoyer des dizaines
   d'appels de stockage simultanés (ce qui déclenche le rate limit) en
   ne traitant que quelques lignes à la fois, avec une petite pause.
   "gen" (optionnel) permet d'abandonner le travail si l'onglet a changé pendant
   le chargement ; si non fourni (ex. import/export), le lot va toujours au bout. */
let renderGeneration = 0;
async function runWithLimit(items, worker, limit, delayMs, gen){
  const checkGen = gen!==undefined;
  for(let i=0; i<items.length; i+=limit){
    if(checkGen && gen!==renderGeneration) return; // l'utilisateur a changé d'onglet : on arrête ce lot obsolète
    const chunk = items.slice(i, i+limit);
    await Promise.all(chunk.map(worker));
    if(i+limit < items.length){
      await new Promise(r=>setTimeout(r, delayMs));
      if(checkGen && gen!==renderGeneration) return;
    }
  }
}

/* Disponibilité (Présent+Dispo) par genre pour une séance donnée */
function genderAvailability(data, roster){
  let mAvail=0,mTotal=0,fAvail=0,fTotal=0;
  roster.forEach(player=>{
    const s = data[player.name];
    const available = (s==="P"||s==="D");
    if(player.gender==="M"){ mTotal++; if(available) mAvail++; }
    else { fTotal++; if(available) fAvail++; }
  });
  return {mAvail,mTotal,fAvail,fTotal};
}

/* Effectif jugé suffisant pour un match : au moins 2 filles ET 6 joueur·ses au total (dispo ou présent·e) */
function isSquadSufficient(mAvail, fAvail){
  return fAvail>=2 && (mAvail+fAvail)>=6;
}

/* Effectif suffisant :
   - Match / Coupe : au moins 2 filles ET 6 joueur·ses au total (dispo ou présent·e)
   - Entraînement / semaine exempte : 6 joueur·ses au total suffit, pas de règle de genre */
function isSquadSufficient(mAvail, fAvail, sessionType){
  const total = mAvail+fAvail;
  if(sessionType==="entrainement" || sessionType==="bye") return total>=6;
  return fAvail>=2 && total>=6;
}

function tallyHTML(data, roster, sessionType){
  let p=0,d=0,a=0,u=0;
  roster.forEach(player=>{
    const s = data[player.name];
    if(s==="P") p++; else if(s==="D") d++; else if(s==="A") a++; else u++;
  });
  const {mAvail,mTotal,fAvail,fTotal} = genderAvailability(data, roster);
  const ok = isSquadSufficient(mAvail, fAvail, sessionType);
  const isTraining = (sessionType==="entrainement" || sessionType==="bye");
  const genderLine = isTraining
    ? `<span class="gt-total">Disponibles : <b>${mAvail+fAvail}</b>/${mTotal+fTotal}</span>`
    : `<span class="gt-f">♀ Filles présentes/dispos : <b>${fAvail}</b>/${fTotal}</span>
       <span class="gt-m">♂ Garçons présents/dispos : <b>${mAvail}</b>/${mTotal}</span>`;
  return `
    <div class="tally">
      <div class="present">PRÉS. <span class="n">${p}</span></div>
      <div class="dispo">DISPO <span class="n">${d}</span></div>
      <div class="absent">ABS. <span class="n">${a}</span></div>
      <div class="unset">— <span class="n">${u}</span></div>
    </div>
    <div class="gendertally">
      ${genderLine}
      <span class="suff-badge ${ok?'ok':'warn'}">${ok?'✓ Effectif suffisant':'⚠ Effectif insuffisant'}</span>
    </div>
  `;
}

function sessionHeadHTML(team, s, actionIconsHTML){

    const confirmBadge = s.confirmed===true
      ? `<span class="confirmed">✓ Confirmé</span>`
      : `<span class="unconfirmed">⚠ Non confirmé</span>`;
    metaHTML = `<span><b>${dayName} ${f.day} ${f.monthLabel} ${f.year}</b></span><span class="match-time">${s.time||""}</span><span>${s.home===true?"Domicile":(s.home===false?"Extérieur":"Domicile/Extérieur à confirmer")}</span><span>${where}</span><span>${confirmBadge}</span>`;
    if(s.note) noteHTML = `<div class="note">${s.note}</div>`;
    const contact = OPPONENT_CONTACTS[s.opponent];
    if(contact){
      const telHref = "tel:"+contact.phone.replace(/\s/g,"");
      noteHTML += `<div class="opp-contact">📞 <b>${contact.name}</b> — <a href="${telHref}">${contact.phone}</a></div>`;
    }
  } else if(s.type==="coupe"){
    title = s.label;
    metaHTML = `<span><b>${dayName} ${f.day} ${f.monthLabel} ${f.year}</b></span><span>Horaire/adversaire selon tirage</span>`;
    noteHTML = `<div class="note">Coupe du Calvados : n'a lieu que si l'équipe est encore qualifiée. Vérifier le tirage avant l'entraînement.</div>`;
  } else if(s.type==="bye"){
    title = "Semaine sans match (exempt)";
    metaHTML = `<span><b>${dayName} ${f.day} ${f.monthLabel} ${f.year}</b></span><span>Entraînement normal 20h30–22h30</span>`;
  } else {
    title = "Entraînement";
    metaHTML = `<span><b>${dayName} ${f.day} ${f.monthLabel} ${f.year}</b></span><span>20h30–22h30</span><span>${GYM_COLLEVILLE}</span>`;
    if(s.note) noteHTML = `<div class="note">${s.note}</div>`;
  }
  const isCommonTraining = isTrainingType(s.type) && isCommonTrainingDate(s.date);
  const labelText = isCommonTraining ? "Équipe 1 & Équipe 2 · Entraînement commun" : TEAM_LABEL[team];
  const titleRow = `<div class="sess-title-row"><h2>${title}</h2>${actionIconsHTML ? `<div class="action-icons-inline">${actionIconsHTML}</div>` : ""}</div>`;
  return `<div style="font-family:var(--font-mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">${labelText}</div>${titleRow}<div class="sess-meta">${metaHTML}</div>${noteHTML}`;
}

/* Filles avant garçons, puis ordre alphabétique du prénom */
function sortRosterForDisplay(list){
  return [...list].sort((a,b)=>{
    if(a.gender !== b.gender) return a.gender==="F" ? -1 : 1;
    return a.name.localeCompare(b.name, "fr", {sensitivity:"base"});
  });
}
/* "Christelle Bataille" -> "Christelle B." (gain de place sur mobile) */
function shortPlayerName(fullName){
  const parts = fullName.trim().split(/\s+/);
  if(parts.length<2) return parts[0];
  return `${parts[0]} ${parts[1][0]}.`;
}
const STATUS_LABEL = {P:"Présent", D:"Disponible", A:"Absent"};
/* Ordre de cycle au clic sur la pastille : Présent -> (Disponible, matchs seulement) -> Absent -> vide */
function nextStatusInCycle(current, trainingOnly){
  const cycle = trainingOnly ? ["P","A"] : ["P","D","A"];
  if(!current) return cycle[0];
  const idx = cycle.indexOf(current);
  if(idx===-1 || idx===cycle.length-1) return null;
  return cycle[idx+1];
}

function buildRosterBlock(team, iso, data, sessionType, roster){
  roster = roster || ROSTERS[team];
  const trainingOnly = isTrainingType(sessionType); // entraînement/exempt : Présent ou Absent uniquement
  const isCombined = roster.length>0 && roster[0].srcTeam !== undefined;
  const block = document.createElement("div");

  function buildPlayerRow(player){
    const name = player.name;
    const row = document.createElement("div");
    row.className = "prow-compact status-"+(data[name]||"unset");
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.title = data[name] ? STATUS_LABEL[data[name]] : "Non renseigné";
    row.innerHTML = `
      <span class="pname-short ${player.gender==="M"?"name-m":"name-f"}">${shortPlayerName(name)}</span>
    `;

    async function attemptCycle(){
      const prevValue = data[name];
      const newValue = nextStatusInCycle(prevValue, trainingOnly);
      if(newValue===null) delete data[name]; else data[name] = newValue;

      // Retour visuel immédiat (optimiste) : on n'attend pas la fin de la sauvegarde
      // pour montrer le changement, afin d'éviter toute sensation de lenteur au clic.
      row.className = "prow-compact status-"+(data[name]||"unset");
      row.title = data[name] ? STATUS_LABEL[data[name]] : "Non renseigné";
      updateRowCount(team, iso);

      const ok = await saveAttendance(team, iso, data);
      if(!ok){
        // La sauvegarde a échoué malgré les tentatives : on annule le changement visuel
        // pour ne jamais laisser affiché un état qui n'a pas réellement été enregistré.
        if(prevValue===undefined) delete data[name]; else data[name] = prevValue;
        row.className = "prow-compact status-"+(data[name]||"unset");
        row.title = data[name] ? STATUS_LABEL[data[name]] : "Non renseigné";
        updateRowCount(team, iso);
        showSaveError(row, attemptCycle);
      } else {
        const existingMsg = row.nextElementSibling;
        if(existingMsg && existingMsg.classList.contains("save-error-msg")) existingMsg.remove();
      }
    }
    row.addEventListener("click", attemptCycle);
    row.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); attemptCycle(); } });
    return row;
  }

  if(isCombined){
    const wrap = document.createElement("div");
    wrap.className = "roster-columns";
    const col1 = document.createElement("div");
    col1.className = "roster-col";
    col1.innerHTML = `<div class="roster-col-label t-team1">Équipe 1</div>`;
    sortRosterForDisplay(roster.filter(p=>p.srcTeam==="team1")).forEach(p=> col1.appendChild(buildPlayerRow(p)));
    const col2 = document.createElement("div");
    col2.className = "roster-col";
    col2.innerHTML = `<div class="roster-col-label t-team2">Équipe 2</div>`;
    sortRosterForDisplay(roster.filter(p=>p.srcTeam==="team2")).forEach(p=> col2.appendChild(buildPlayerRow(p)));
    wrap.appendChild(col1);
    wrap.appendChild(col2);
    block.appendChild(wrap);
  } else {
    const col = document.createElement("div");
    col.className = "roster-col";
    sortRosterForDisplay(roster).forEach(p=> col.appendChild(buildPlayerRow(p)));
    block.appendChild(col);
  }
  return block;
}

/* ===== Vue "présences par joueur" : choisir un·e joueur·se, voir/cocher sa présence

let playerPanelOpenFor = null; // team ("team1"/"team2"/"commun") pour laquelle le panneau est ouvert, ou null
let playerPanelSelection = {}; // mémorise le dernier joueur choisi par contexte, ex. {team1:"Elise Nguyen"}

function playersForContext(context){

async function renderPlayerSessionsList(context){
  const container = document.getElementById("player-sess-container");
  if(!container) return;

  if(!sel){ container.innerHTML = ""; return; }
  const [team, playerName] = sel.split("|");
  const sessions = effectiveSessions(team);
  container.innerHTML = '<div class="empty-hint" style="padding:20px;">Chargement…</div>';

  const listEl = document.createElement("div");
  listEl.className = "player-sess-list";
  let lastMonth = null;
  const rows = [];
  sessions.forEach(s=>{
    const f = fmtDate(s.date);
    const key = f.year+"-"+f.month;
    if(key!==lastMonth){
      lastMonth = key;
      const ml = document.createElement("div");
      ml.className = "player-month-label";
      ml.textContent = f.monthLabel+" "+f.year;
      listEl.appendChild(ml);
    }
    const {lbl, badge, badgeClass} = sessionLabel(s);
    const row = document.createElement("div");
    row.className = "player-sess-row";
    row.innerHTML = `
      <div class="psr-date">${String(f.day).padStart(2,"0")}/${String(f.month+1).padStart(2,"0")}</div>
      <div class="psr-info">
        <div class="psr-lbl">${lbl}</div>
        <div class="psr-sub"><span class="badge ${badgeClass}" style="font-size:9px;">${badge}</span></div>
      </div>
      <div class="statusbtns" id="psr-btns-${s.date}">
        <button class="sbtn" data-s="P" title="Présent">P</button>
        ${isTrainingType(s.type) ? "" : `<button class="sbtn" data-s="D" title="Disponible">D</button>`}
        <button class="sbtn" data-s="A" title="Absent">A</button>
      </div>
    `;
    async function attemptPlayerStatusChange(targetStatus){
      const data = await loadAttendance(team, s.date);
      const prevValue = data[playerName];
      data[playerName] = (prevValue===targetStatus) ? undefined : targetStatus;
      if(data[playerName]===undefined) delete data[playerName];

      // Retour visuel immédiat (optimiste), sauvegarde en arrière-plan
      row.querySelectorAll(".sbtn").forEach(bb=>bb.classList.remove("on-p","on-d","on-a"));
      if(data[playerName]){ const btn=row.querySelector(`[data-s="${data[playerName]}"]`); if(btn) btn.classList.add("on-"+data[playerName].toLowerCase()); }
      updateRowCount(team, s.date);

      const ok = await saveAttendance(team, s.date, data);
      if(!ok){
        if(prevValue===undefined) delete data[playerName]; else data[playerName] = prevValue;
        row.querySelectorAll(".sbtn").forEach(bb=>bb.classList.remove("on-p","on-d","on-a"));
        if(data[playerName]){ const btn=row.querySelector(`[data-s="${data[playerName]}"]`); if(btn) btn.classList.add("on-"+data[playerName].toLowerCase()); }
        updateRowCount(team, s.date);
        showSaveError(row, ()=>attemptPlayerStatusChange(targetStatus));
      } else {
        const existingMsg = row.nextElementSibling;
        if(existingMsg && existingMsg.classList.contains("save-error-msg")) existingMsg.remove();
      }
    }
    row.querySelectorAll(".sbtn").forEach(b=>{
      b.addEventListener("click", ()=> attemptPlayerStatusChange(b.dataset.s));
    });
    listEl.appendChild(row);
    rows.push({date:s.date, row});
  });
  container.innerHTML = "";
  container.appendChild(listEl);

  // Charge le statut existant pour ce joueur, séance par séance, avec une concurrence limitée
  await runWithLimit(rows, async ({date, row})=>{
    const data = await loadAttendance(team, date);
    const status = data[playerName];
    if(status){
      const btn = row.querySelector(`[data-s="${status}"]`);
      if(btn) btn.classList.add("on-"+status.toLowerCase());
    }
  }, 2, 250);
}

async function renderBilan(team){
  const panel = document.getElementById("bilanPanel");
  const roster = ROSTERS[team];
  const allDates = effectiveSessions(team).map(s=>s.date);
  panel.innerHTML = `
    <div class="sess-head">
      <h2>Bilan de présence — ${TEAM_LABEL[team]}</h2>
      <div class="sess-meta"><span>Cumul sur toutes les séances déjà renseignées</span></div>
    </div>
    <div class="bilan-note">Chargement…</div>
  `;

  const counts = {};
  roster.forEach(p=> counts[p.name] = {P:0,D:0,A:0,total:0});
  let sessionsCounted = 0;

  for(const iso of allDates){
    const data = await loadAttendance(team, iso);
    if(!data || Object.keys(data).length===0) continue;
    sessionsCounted++;
    roster.forEach(p=>{
      const s = data[p.name];
      if(s==="P"||s==="D"||s==="A"){
        counts[p.name][s]++;
        counts[p.name].total++;
      }
    });
  }

  const note = panel.querySelector(".bilan-note");
  if(sessionsCounted===0){
    note.textContent = "Aucune séance renseignée pour l'instant.";
    return;
  }
  note.textContent = `${sessionsCounted} séance(s) renseignée(s) sur ${allDates.length} possibles.`;

  // Résumé garçons/filles cumulé sur la saison (présents + disponibles)
  let mAvail=0, mTotal=0, fAvail=0, fTotal=0;
  roster.forEach(p=>{
    const c = counts[p.name];
    if(p.gender==="M"){ mAvail += c.P+c.D; mTotal += c.total; }
    else { fAvail += c.P+c.D; fTotal += c.total; }
  });
  const genderSummary = document.createElement("div");
  genderSummary.className = "gendertally";
  genderSummary.style.marginBottom = "12px";
  genderSummary.innerHTML = `
    <span class="gt-f">♀ Filles présentes/dispos (cumul) : <b>${fAvail}</b>/${fTotal}</span>
    <span class="gt-m">♂ Garçons présents/dispos (cumul) : <b>${mAvail}</b>/${mTotal}</span>
  `;
  panel.appendChild(genderSummary);

  const tbl = document.createElement("table");
  tbl.className = "bilan";
  tbl.innerHTML = `
    <thead><tr><th>Joueur·se</th><th>Présent</th><th>Dispo</th><th>Absent</th><th>Taux présent+dispo</th></tr></thead>
    <tbody></tbody>
  `;
  const tbody = tbl.querySelector("tbody");
  roster.forEach(p=>{
    const name = p.name;
    const c = counts[name];
    const rate = c.total>0 ? Math.round(((c.P+c.D)/c.total)*100) : 0;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${name} <span class="gender-tag ${p.gender==="M"?"gt-tag-m":"gt-tag-f"}">${p.gender==="M"?"♂":"♀"}</span></td>
      <td>${c.P}</td>
      <td>${c.D}</td>
      <td>${c.A}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="bar-wrap"><div class="bar-fill" style="width:${rate}%"></div></div>
          <span style="font-family:var(--font-mono);font-size:12px;width:36px;">${rate}%</span>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
  panel.appendChild(tbl);
}

/* ===== Vue commune : une ligne par événement, colonne équipe =====
   Quand un entraînement est commun aux 2 équipes (aucune des 2 n'a match ce jour-là),
   on ne montre qu'UNE seule ligne "both" au lieu d'une ligne par équipe. */
function mergedEvents(){
  const t1 = effectiveSessions("team1");
  const t2 = effectiveSessions("team2");
  const t2ByDate = {};
  t2.forEach(s=> t2ByDate[s.date]=s);
  const rows = [];
  const consumedT2Dates = new Set();
  t1.forEach(s=>{
    const s2 = t2ByDate[s.date];
    if(s2 && isTrainingType(s.type) && isTrainingType(s2.type)){
      rows.push({team:"both", session:s});
      consumedT2Dates.add(s.date);
    } else {
      rows.push({team:"team1", session:s});
    }
  });
  t2.forEach(s=>{
    if(consumedT2Dates.has(s.date)) return;
    rows.push({team:"team2", session:s});
  });
  rows.sort((a,b)=>{
    if(a.session.date !== b.session.date) return a.session.date < b.session.date ? -1 : 1;
    return a.team < b.team ? -1 : 1;
  });
  return rows;
}

/* ===== Import / Export : sauvegarde complète (effectifs, calendrier personnalisé, présences) ===== */
function todayStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadJSON(obj, filename){
  downloadBlob(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}), filename);
}
function csvEscape(val){
  const s = (val===null||val===undefined) ? "" : String(val);
  if(/[";\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCSV(rows, filename){
  // Point-virgule comme séparateur (convention Excel FR) + BOM pour un affichage correct des accents
  const csv = rows.map(r=> r.map(csvEscape).join(";")).join("\r\n");
  downloadBlob(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"}), filename);
}

/* Récupère toutes les présences enregistrées, regroupées par équipe puis par date,
   avec une concurrence limitée pour éviter le rate limit du stockage. */
async function fetchAttendanceMap(){
  const map = {team1:{}, team2:{}, commun:{}};
  for(const team of ["team1","team2","commun"]){
    let keys = [];
    try{
      const res = await backendList("attendance:"+team+":", true);
      keys = (res && res.keys) ? res.keys : [];
    }catch(e){ logSilently("storage.list", e); }
    await runWithLimit(keys, async (key)=>{
      try{
        const res = await backendGet(key, true);
        if(res){
          const date = key.split(":")[2];
          map[team][date] = JSON.parse(res.value);
        }
      }catch(e){ /* ignore une clé en erreur */ }
    }, 2, 250);
  }
  return map;
}

const TYPE_LABEL_FR = {match:"Match", entrainement:"Entraînement", coupe:"Coupe", bye:"Exempt"};
const STATUS_LABEL_FR = {P:"Présent", D:"Disponible", A:"Absent"};

async function exportCSV(btn){
  const originalLabel = btn.textContent;
  btn.textContent = "⏳ Export en cours…";
  btn.disabled = true;
  try{
    const attMap = await fetchAttendanceMap();
    const rows = [[
      "Équipe","Date","Jour","Type","Adversaire / Libellé","Domicile ou Extérieur",
      "Heure","Lieu","Joueur·se","Genre","Statut"
    ]];
    for(const team of ["team1","team2"]){
      const sessions = effectiveSessions(team);
      const roster = ROSTERS[team];
      sessions.forEach(s=>{
        const isCommon = isTrainingType(s.type) && isCommonTrainingDate(s.date);
        const data = isCommon ? (attMap.commun[s.date]||{}) : ((attMap[team] && attMap[team][s.date]) || {});
        const f = fmtDate(s.date);
        const dayName = DAYNAME[f.weekday];
        const typeLabel = TYPE_LABEL_FR[s.type] || s.type;
        const homeLabel = s.type==="match" ? (s.home===true?"Domicile":(s.home===false?"Extérieur":"À confirmer")) : "";
        const oppOrLabel = s.opponent || s.label || "";
        roster.forEach(p=>{
          const statusRaw = data[p.name] || "";
          rows.push([
            TEAM_LABEL[team], s.date, dayName, typeLabel, oppOrLabel, homeLabel,
            s.time||"", s.place||"", p.name, p.gender==="M"?"Garçon":"Fille",
            STATUS_LABEL_FR[statusRaw] || ""
          ]);
        });
      });
    }
    downloadCSV(rows, `asvb-bieville-export-${todayStamp()}.csv`);
  }catch(e){
    logSilently("export", e);
    alert("Une erreur est survenue pendant l'export CSV.");
  }finally{
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

async function handleImportFile(fileInput, statusEl){
  const file = fileInput.files[0];
  if(!file) return;
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    alert("Fichier illisible : ce n'est pas un export JSON valide.");
    fileInput.value = "";
    return;
  }
  if(!data || typeof data !== "object" || !("version" in data)){
    alert("Ce fichier ne ressemble pas à un export de cet outil.");
    fileInput.value = "";
    return;
  }
  const nbPlayers = (data.rosters?.team1?.length||0) + (data.rosters?.team2?.length||0);
  const nbCustomSessions = Object.keys(data.sessionOverrides?.team1||{}).length + Object.keys(data.sessionOverrides?.team2||{}).length;
  const nbAttendance = Object.keys(data.attendance||{}).length;
  const exportedAt = data.exportedAt ? new Date(data.exportedAt).toLocaleString("fr-FR") : "date inconnue";
  const confirmMsg = `Fichier exporté le ${exportedAt} :\n`
    + `• ${nbPlayers} joueur·se(s) au total\n`
    + `• ${nbCustomSessions} séance(s) personnalisée(s) (ajout/modif/suppr.)\n`
    + `• ${nbAttendance} feuille(s) de présence\n\n`
    + `⚠️ Cela REMPLACE les données actuelles, partagées avec tous les utilisateurs de cet outil. Continuer ?`;
  if(!confirm(confirmMsg)){ fileInput.value = ""; return; }

  if(statusEl) statusEl.textContent = "Import en cours…";

  if(data.rosters){
    for(const team of ["team1","team2"]){
      if(Array.isArray(data.rosters[team])){
        ROSTERS[team] = data.rosters[team];
        persistRoster(team);
      }
    }
  }
  if(data.sessionOverrides){
    for(const team of ["team1","team2"]){
      if(data.sessionOverrides[team]){
        sessionOverrides[team] = data.sessionOverrides[team];
        persistSessionOverrides(team);
      }
    }
  }
  if(data.attendance){
    const keys = Object.keys(data.attendance);
    await runWithLimit(keys, async (key)=>{
      try{
        await backendSet(key, data.attendance[key], true);
        attendanceCache[key] = JSON.parse(data.attendance[key]);
      }catch(e){ logSilently("import:"+key, e); }
    }, 2, 250);
  }

  fileInput.value = "";
  if(statusEl) statusEl.textContent = "✓ Import terminé.";
  refreshCurrentView();
}

function renderImportExportSection(){
  return `
    <div class="panel" style="margin-bottom:16px;">
      <h3 style="margin-top:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:16px;">💾 Sauvegarde des données</h3>
      <p style="color:var(--muted);font-size:13px;margin-top:0;">
        Exportez les effectifs, le calendrier personnalisé et toutes les feuilles de présence, ou restaurez une sauvegarde précédente.
        L'import remplace les données actuelles pour tous les utilisateurs.
      </p>
      <div class="form-actions">
        <button class="btn-primary" id="export-btn">⬇️ Exporter tout (JSON — pour ré-importer plus tard)</button>
        <button class="btn-secondary" id="export-csv-btn">⬇️ Exporter en CSV (pour Excel)</button>
        <button class="btn-secondary" id="import-btn">⬆️ Importer une sauvegarde JSON</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      </div>
      <div id="import-status" style="color:var(--muted);font-size:12px;margin-top:8px;"></div>
    </div>
  `;
}

function wireImportExportSection(){
  document.getElementById("export-btn").addEventListener("click", (e)=> exportAllData(e.target));
  document.getElementById("export-csv-btn").addEventListener("click", (e)=> exportCSV(e.target));
  const fileInput = document.getElementById("import-file-input");
  document.getElementById("import-btn").addEventListener("click", ()=> fileInput.click());
  fileInput.addEventListener("change", ()=> handleImportFile(fileInput, document.getElementById("import-status")));
}

function renderParamsPage(){
  const el = document.getElementById("timeline");
  el.innerHTML = `
    <div class="panel" style="border:none;border-radius:0;">
      ${renderImportExportSection()}
      <div id="params-team1" class="params-team p-team1"></div>
      <div id="params-team2" class="params-team p-team2"></div>
    </div>
  `;
  wireImportExportSection();
  renderParamsTeam("team1");
  renderParamsTeam("team2");
}

function renderParamsTeam(team){
  const container = document.getElementById(`params-team${team==="team1"?1:2}`);
  const roster = ROSTERS[team];
  const mgr = MANAGERS[team];
  container.innerHTML = `
    <h3>${TEAM_LABEL[team]} <span style="color:var(--muted);font-size:12px;font-family:var(--font-mono);text-transform:none;">(${roster.length} joueur·ses)</span></h3>
    <div class="manager-box" id="manager-box-${team}">
      <div class="manager-info">
        <span class="manager-label">👤 Responsable d'équipe</span>
        <span class="manager-name">${mgr.name || "(non renseigné)"}</span>
        ${mgr.email ? `<a href="mailto:${mgr.email}" class="manager-email">✉️ ${mgr.email}</a>` : ""}
      </div>
      <button class="icon-btn" id="edit-manager-${team}">✏️</button>
    </div>
    <div class="plist" id="plist-${team}"></div>
    <div class="add-player-row">
      <input type="text" id="new-name-${team}" placeholder="Nom du ou de la joueur·se">
      <select id="new-gender-${team}">
        <option value="F">♀ Fille</option>
        <option value="M">♂ Garçon</option>
      </select>
      <button class="btn-primary" id="add-player-${team}">➕ Ajouter</button>
    </div>
  `;
  container.querySelector(`#edit-manager-${team}`).addEventListener("click", ()=> openEditManagerForm(team));
  const plist = container.querySelector(`#plist-${team}`);
  roster.forEach((player, idx)=>{
    const row = document.createElement("div");
    row.className = "prow-param";
    row.innerHTML = `
      <span class="pname">${player.name}</span>
      <span class="gender-tag ${player.gender==="M"?"gt-tag-m":"gt-tag-f"}">${player.gender==="M"?"♂":"♀"}</span>
      <div class="action-icons">
        <button class="icon-btn" data-act="edit">✏️</button>
        <button class="icon-btn" data-act="del">🗑</button>
      </div>
    `;
    row.querySelector('[data-act="edit"]').addEventListener("click", ()=> openEditPlayerForm(team, idx, row));
    row.querySelector('[data-act="del"]').addEventListener("click", ()=>{
      if(confirm(`Retirer ${player.name} de l'effectif ${TEAM_LABEL[team]} ?\n(L'historique de présence déjà enregistré est conservé mais ne sera plus affiché.)`)){
        ROSTERS[team].splice(idx,1);
        persistRoster(team);
        renderParamsTeam(team);
      }
    });
    plist.appendChild(row);
  });
  container.querySelector(`#add-player-${team}`).addEventListener("click", ()=>{
    const nameInput = container.querySelector(`#new-name-${team}`);
    const name = nameInput.value.trim();
    if(!name){ alert("Merci de saisir un nom."); return; }
    const gender = container.querySelector(`#new-gender-${team}`).value;
    ROSTERS[team].push(PL(name, gender));
    persistRoster(team);
    renderParamsTeam(team);
  });
}

function openEditManagerForm(team){
  const box = document.getElementById(`manager-box-${team}`);
  const mgr = MANAGERS[team];
  box.innerHTML = `
    <div class="manager-info" style="flex:1;">
      <span class="manager-label">👤 Responsable d'équipe</span>
      <input type="text" id="edit-mgr-name" value="${mgr.name||""}" placeholder="Nom du ou de la responsable" style="margin-bottom:6px;">
      <input type="email" id="edit-mgr-email" value="${mgr.email||""}" placeholder="Adresse e-mail">
    </div>
    <div class="action-icons">
      <button class="icon-btn" id="save-manager-${team}">💾</button>
      <button class="icon-btn" id="cancel-manager-${team}">✕</button>
    </div>
  `;
  box.querySelector(`#save-manager-${team}`).addEventListener("click", ()=>{
    const name = box.querySelector("#edit-mgr-name").value.trim();
    const email = box.querySelector("#edit-mgr-email").value.trim();
    MANAGERS[team] = {name, email};
    persistManager(team);
    renderParamsTeam(team);
  });
  box.querySelector(`#cancel-manager-${team}`).addEventListener("click", ()=> renderParamsTeam(team));
}

function openEditPlayerForm(team, idx, rowEl){
  const player = ROSTERS[team][idx];
  rowEl.innerHTML = `
    <input type="text" id="edit-name" value="${player.name}" style="flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;">
    <select id="edit-gender" style="background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;">
      <option value="F" ${player.gender==="F"?"selected":""}>♀ Fille</option>
      <option value="M" ${player.gender==="M"?"selected":""}>♂ Garçon</option>
    </select>
    <div class="action-icons">
      <button class="icon-btn" id="save-edit">💾</button>
      <button class="icon-btn" id="cancel-edit">✕</button>
    </div>
  `;
  rowEl.querySelector("#save-edit").addEventListener("click", ()=>{
    const newName = rowEl.querySelector("#edit-name").value.trim();
    if(!newName){ alert("Le nom ne peut pas être vide."); return; }
    ROSTERS[team][idx] = PL(newName, rowEl.querySelector("#edit-gender").value);
    persistRoster(team);
    renderParamsTeam(team);
  });
  rowEl.querySelector("#cancel-edit").addEventListener("click", ()=> renderParamsTeam(team));
}

/* Chargement initial : effectifs personnalisés + calendrier personnalisé depuis le stockage,
   avant le premier rendu, pour éviter d'afficher les valeurs par défaut puis de les remplacer. */
async function init(){
  // Affichage immédiat (valeurs par défaut déjà en mémoire) : l'appli n'est jamais vide,
  // même si le chargement des personnalisations enregistrées est lent ou échoue.
  currentTeam = computeCurrentTeam();
  document.getElementById("tab-team1").classList.toggle("active", activeTeams.has("team1"));
  document.getElementById("tab-team2").classList.toggle("active", activeTeams.has("team2"));
  applyTheme();
  renderToolbar();
  refreshCurrentView();

  // Puis on charge en arrière-plan les effectifs/calendrier/responsables/thème personnalisés
  // et on rafraîchit l'affichage une fois disponibles.
  try{
    await Promise.all([loadRosters(), loadSessionOverrides(), loadManagers(), loadThemePref()]);
  }catch(e){
    logSilently("init", e);
  }
  applyTheme();
  renderToolbar();
  refreshCurrentView();
}
init();
</script>
</body>
</html>
